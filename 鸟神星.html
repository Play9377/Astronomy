<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鸟神星系统模拟器 2026</title>
    <style>
        body { margin: 0; background: #02030a; color: #ffab91; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
        canvas { display: block; }
        
        /* 科技感 HUD 控制面板 */
        .hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(25, 12, 8, 0.9);
            padding: 22px; border-radius: 12px;
            border: 1px solid #ff7043;
            box-shadow: 0 0 30px rgba(255, 112, 67, 0.3);
            width: 300px; backdrop-filter: blur(10px);
            z-index: 100;
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px #ff7043; border-bottom: 1px solid rgba(255,112,67,0.3); padding-bottom: 8px; }
        
        .ctrl-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        button {
            background: rgba(255, 112, 67, 0.1); border: 1px solid #ff7043;
            color: #ff7043; padding: 10px; border-radius: 6px; cursor: pointer;
            transition: 0.3s; font-size: 12px; font-weight: bold;
        }
        button:hover { background: #ff7043; color: #000; box-shadow: 0 0 15px #ff7043; }
        .reset-btn { grid-column: span 2; border-color: #ff5252; color: #ff5252; }
        .reset-btn:hover { background: #ff5252; color: #fff; }

        .status-info { font-size: 13px; line-height: 1.8; color: #eee; }
        .status-info b { color: #ff7043; }
        
        .moon-legend {
            margin-top: 15px; font-size: 11px; color: #ffccbc;
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="hud">
    <h2>MAKEMAKE SYSTEM 2026</h2>
    <div class="ctrl-group">
        <button onclick="updateTime(0.5)">减速 0.5x</button>
        <button onclick="updateTime(2.0)">加速 2.0x</button>
        <button id="pauseBtn" onclick="togglePause()" style="grid-column: span 2;">暂停模拟引擎</button>
        <button class="reset-btn" onclick="resetSim()">初始化物理相位</button>
    </div>
    <div class="status-info">
        当前流速: <b id="warpTxt">1.0x</b><br>
        系统状态: <b id="statTxt">正常运行</b><br>
        当前日期: <b>2026-01-17</b>
    </div>
    <div class="moon-legend">
        • 鸟神星 Makemake (矮行星)<br>
        • 鸟卫一 S/2015 (136472) 1 (MK2)
    </div>
</div>

<canvas id="makeCanvas"></canvas>

<script>
    const canvas = document.getElementById('makeCanvas');
    const ctx = canvas.getContext('2d');

    let time = 0;
    let speed = 1.0;
    let isPaused = false;
    let stars = [];
    let asteroids = [];

    const makeBody = { cn: "鸟神星", en: "Makemake", r: 38 };
    // 卫星数据 (2016年确认的MK2)
    const moon = { cn: "鸟卫一", en: "MK2", d: 140, s: 6, v: 0.015, c: "#90a4ae" };

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 随机星空背景
        stars = Array.from({length: 450}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5,
            alpha: Math.random()
        }));

        // 陨石流 (柯伊伯带边缘碎片)
        asteroids = Array.from({length: 120}, () => ({
            angle: Math.random() * Math.PI * 2,
            dist: 280 + Math.random() * 150,
            v: 0.002 + Math.random() * 0.005,
            size: 0.5 + Math.random() * 2
        }));
    }

    function draw() {
        ctx.fillStyle = "#02030a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // 1. 恒星背景
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        });

        // 2. 陨石流壁垒 (模拟深空碎片)
        asteroids.forEach(a => {
            const ax = cx + Math.cos(time * a.v + a.angle) * a.dist;
            const ay = cy + Math.sin(time * a.v + a.angle) * a.dist;
            ctx.fillStyle = "#5d4037";
            ctx.beginPath(); ctx.arc(ax, ay, a.size, 0, Math.PI * 2); ctx.fill();
        });

        // 3. 鸟神星主体 (独特的红棕色冷色调)
        const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, makeBody.r);
        grad.addColorStop(0, '#ffccbc');
        grad.addColorStop(0.6, '#ff8a65');
        grad.addColorStop(1, '#3e2723');
        
        ctx.shadowBlur = 35; ctx.shadowColor = "rgba(255, 138, 101, 0.4)";
        ctx.beginPath(); ctx.arc(cx, cy, makeBody.r, 0, Math.PI * 2);
        ctx.fillStyle = grad; ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(`${makeBody.cn} ${makeBody.en}`, cx, cy - makeBody.r - 25);

        // 4. 清晰轨道与引力壁垒
        ctx.beginPath();
        ctx.arc(cx, cy, moon.d, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 112, 67, 0.2)";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 10]); // 虚线清晰轨道
        ctx.stroke();
        ctx.setLineDash([]); 

        // 5. 卫星 MK2
        const x = cx + Math.cos(time * moon.v) * moon.d;
        const y = cy + Math.sin(time * moon.v) * moon.d;

        ctx.shadowBlur = 15; ctx.shadowColor = moon.c;
        ctx.beginPath(); ctx.arc(x, y, moon.s, 0, Math.PI * 2);
        ctx.fillStyle = moon.c; ctx.fill();
        ctx.shadowBlur = 0;

        // 卫星中英文标签
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`${moon.cn} ${moon.en}`, x + moon.s + 10, y + 4);

        if (!isPaused) time += 0.5 * speed;
        requestAnimationFrame(draw);
    }

    // 控制功能
    function updateTime(f) {
        speed *= f;
        speed = Math.min(Math.max(speed, 0.1), 16);
        document.getElementById('warpTxt').innerText = speed.toFixed(1) + "x";
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').innerText = isPaused ? "重启物理模拟" : "暂停模拟引擎";
        document.getElementById('statTxt').innerText = isPaused ? "引擎已切断" : "正常运行";
        document.getElementById('statTxt').style.color = isPaused ? "#ff5252" : "#ff7043";
    }

    function resetSim() {
        time = 0; speed = 1.0; isPaused = false;
        document.getElementById('warpTxt').innerText = "1.0x";
        document.getElementById('statTxt').innerText = "正常运行";
        document.getElementById('pauseBtn').innerText = "暂停模拟引擎";
    }

    window.addEventListener('resize', init);
    init();
    draw();
</script>

</body>
</html>
