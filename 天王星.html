<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>天王星系统指挥中心 2026</title>
    <style>
        body { margin: 0; background: #000a0d; color: #7de8ff; font-family: 'Microsoft YaHei', sans-serif; overflow: hidden; }
        canvas { display: block; }
        
        /* 科技感 HUD */
        .hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 30, 40, 0.85);
            padding: 20px; border-radius: 12px;
            border: 1px solid #7de8ff;
            box-shadow: 0 0 30px rgba(125, 232, 255, 0.3);
            width: 320px; backdrop-filter: blur(10px);
            z-index: 100;
        }
        h2 { margin: 0 0 10px 0; font-size: 20px; letter-spacing: 2px; color: #fff; border-bottom: 1px solid #7de8ff; padding-bottom: 8px; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        button {
            background: rgba(125, 232, 255, 0.1); border: 1px solid #7de8ff;
            color: #7de8ff; padding: 8px; border-radius: 4px; cursor: pointer;
            transition: 0.3s; font-size: 12px;
        }
        button:hover { background: #7de8ff; color: #000; }
        .reset-btn { grid-column: span 2; border-color: #ff5555; color: #ff5555; }
        .reset-btn:hover { background: #ff5555; color: #fff; }

        .status { font-size: 13px; line-height: 1.6; }
        .status b { color: #fff; }
        
        /* 卫星滚动列表 */
        .moon-box {
            margin-top: 10px; height: 120px; overflow-y: auto;
            font-size: 11px; color: #88ceda; padding-right: 5px;
            scrollbar-width: thin; scrollbar-color: #7de8ff #001e28;
        }
        .moon-item { display: inline-block; width: 50%; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="hud">
    <h2>URANUS SYSTEM 2026</h2>
    <div class="controls">
        <button onclick="changeSpeed(0.5)">减速 <<</button>
        <button onclick="changeSpeed(2.0)">加速 >></button>
        <button id="pauseBtn" onclick="togglePause()" style="grid-column: span 2;">暂停模拟引擎</button>
        <button class="reset-btn" onclick="resetSim()">初始化系统状态</button>
    </div>
    <div class="status">
        时间流速 (Warp): <b id="speedLabel">1.0x</b><br>
        系统日期 (Date): <b>2026-01-17</b><br>
        当前卫星数: <b>29 颗已知卫星</b>
    </div>
    <div class="moon-box" id="moonList"></div>
</div>

<canvas id="uranusCanvas"></canvas>

<script>
    const canvas = document.getElementById('uranusCanvas');
    const ctx = canvas.getContext('2d');

    let time = 0;
    let speed = 1.0;
    let isPaused = false;
    let stars = [];
    let asteroids = [];

    const uranus = { name: "天王星 Uranus", r: 40 };

    // 29 颗卫星数据 (包含5大主卫星及发现的小卫星)
    // 名字, 距离(缩放值), 速度, 大小
    const rawMoons = [
        ["Cordelia", 55, 0.12, 2], ["Ophelia", 62, 0.11, 2], ["Bianca", 68, 0.10, 2],
        ["Cressida", 75, 0.095, 2], ["Desdemona", 82, 0.09, 2], ["Juliet", 90, 0.085, 2],
        ["Portia", 100, 0.08, 3], ["Rosalind", 110, 0.075, 2], ["Cupid", 118, 0.07, 1.5],
        ["Belinda", 125, 0.065, 2], ["Perdita", 135, 0.062, 2], ["Puck", 150, 0.058, 4],
        ["Mab", 165, 0.055, 2], ["Miranda", 190, 0.045, 5], ["Ariel", 230, 0.035, 7],
        ["Umbriel", 280, 0.025, 7], ["Titania", 340, 0.018, 9], ["Oberon", 410, 0.012, 9],
        ["Francisco", 460, 0.009, 2], ["Caliban", 490, 0.008, 2], ["Stephano", 520, 0.007, 2],
        ["Trinculo", 550, 0.006, 1.5], ["Sycorax", 580, 0.0055, 3], ["Margaret", 610, 0.005, 2],
        ["Prospero", 640, 0.0045, 2], ["Setebos", 670, 0.004, 2], ["Ferdinand", 700, 0.0035, 2],
        ["S/2023 U1", 730, 0.003, 1.5], ["S/2023 U2", 760, 0.0025, 1.5]
    ];

    const moons = rawMoons.map(m => ({ name: m[0], dist: m[1], speed: m[2], size: m[3] }));

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 生成列表
        const list = document.getElementById('moonList');
        list.innerHTML = moons.map(m => `<div class="moon-item">• ${m.name}</div>`).join('');

        // 星空
        stars = Array.from({length: 400}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5,
            a: Math.random()
        }));

        // 陨石流 (在外围)
        asteroids = Array.from({length: 100}, () => ({
            angle: Math.random() * Math.PI * 2,
            dist: 450 + Math.random() * 150,
            v: 0.002 + Math.random() * 0.003,
            size: Math.random() * 2
        }));
    }

    function draw() {
        ctx.fillStyle = "#000a0d";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // 1. 星空
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.a})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // 2. 天王星 (采用这种独特的青色渐变)
        const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, uranus.r);
        grad.addColorStop(0, '#e0f7fa');
        grad.addColorStop(0.6, '#4dd0e1');
        grad.addColorStop(1, '#00838f');
        
        ctx.shadowBlur = 30;
        ctx.shadowColor = "#4dd0e1";
        ctx.beginPath();
        ctx.arc(cx, cy, uranus.r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 16px Arial";
        ctx.fillText(uranus.name, cx, cy - uranus.r - 20);

        // 3. 天王星环（垂直向透视，体现其“躺着”的特点）
        ctx.strokeStyle = "rgba(125, 232, 255, 0.2)";
        ctx.lineWidth = 1;
        for(let i=0; i<3; i++) {
            ctx.beginPath();
            // 注意：这里由于天王星侧躺，环的角度与普通行星不同
            ctx.ellipse(cx, cy, uranus.r + 10 + i*8, uranus.r + 5 + i*2, Math.PI / 1.1, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 4. 陨石流
        asteroids.forEach(a => {
            const ax = cx + Math.cos(time * a.v + a.angle) * a.dist;
            const ay = cy + Math.sin(time * a.v + a.angle) * a.dist;
            ctx.fillStyle = "#4f5b62";
            ctx.beginPath();
            ctx.arc(ax, ay, a.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // 5. 29 颗卫星及轨道
        moons.forEach((m, idx) => {
            // 绘制轨道壁垒线
            ctx.beginPath();
            ctx.arc(cx, cy, m.dist, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(125, 232, 255, 0.08)";
            ctx.stroke();

            // 计算卫星位置
            const x = cx + Math.cos(time * m.speed) * m.dist;
            const y = cy + Math.sin(time * m.speed) * m.dist;

            // 卫星主体
            ctx.fillStyle = (idx < 12) ? "#b2ebf2" : (idx < 18 ? "#80deea" : "#4dd0e1");
            ctx.beginPath();
            ctx.arc(x, y, m.size, 0, Math.PI * 2);
            ctx.fill();

            // 只为主要卫星显示名字，避免屏幕过于混乱
            const majorMoons = ["Miranda", "Ariel", "Umbriel", "Titania", "Oberon"];
            if (majorMoons.includes(m.name) || speed < 0.5) {
                ctx.fillStyle = "rgba(255,255,255,0.7)";
                ctx.font = "10px Arial";
                ctx.textAlign = "left";
                ctx.fillText(m.name, x + m.size + 3, y + 3);
            }
        });

        if (!isPaused) time += 0.5 * speed;
        requestAnimationFrame(draw);
    }

    // 控制函数
    function changeSpeed(f) {
        speed *= f;
        speed = Math.min(Math.max(speed, 0.1), 16);
        document.getElementById('speedLabel').innerText = speed.toFixed(1) + "x";
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').innerText = isPaused ? "重启模拟引擎" : "暂停模拟引擎";
        document.getElementById('pauseBtn').style.borderColor = isPaused ? "#ffaa00" : "#7de8ff";
    }

    function resetSim() {
        time = 0; speed = 1.0; isPaused = false;
        document.getElementById('speedLabel').innerText = "1.0x";
        document.getElementById('pauseBtn').innerText = "暂停模拟引擎";
    }

    window.addEventListener('resize', init);
    init();
    draw();
</script>

</body>
</html>
