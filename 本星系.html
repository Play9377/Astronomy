<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>本星系群 80星系运动模拟器 2026</title>
    <style>
        body { margin: 0; background: #000208; color: #00e5ff; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
        canvas { display: block; }
        
        /* 2026 科技感控制面板 */
        .hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 15, 30, 0.85);
            padding: 20px; border-radius: 12px;
            border: 1px solid #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            width: 320px; backdrop-filter: blur(10px);
            z-index: 100;
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px #00e5ff; border-bottom: 1px solid rgba(0,229,255,0.3); padding-bottom: 8px; }
        
        .ctrl-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        button {
            background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff;
            color: #fff; padding: 10px; border-radius: 6px; cursor: pointer;
            transition: 0.3s; font-size: 12px; font-weight: bold;
        }
        button:hover { background: #00e5ff; color: #000; box-shadow: 0 0 15px #00e5ff; }
        .reset-btn { grid-column: span 2; border-color: #ff5252; color: #ff5252; }
        
        .info { font-size: 13px; line-height: 1.8; color: #eee; }
        .info b { color: #00e5ff; }
        
        /* 滚动星系列表 */
        .galaxy-list {
            margin-top: 15px; height: 150px; overflow-y: auto;
            font-size: 11px; color: #81d4fa; border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px; scrollbar-width: thin;
        }
        .galaxy-item { display: inline-block; width: 50%; margin-bottom: 2px; }
        .major { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="hud">
    <h2>LOCAL GROUP SIM 2026</h2>
    <div class="ctrl-group">
        <button onclick="adjustSpeed(0.5)">减速 <<</button>
        <button onclick="adjustSpeed(2.0)">加速 >></button>
        <button id="pauseBtn" onclick="togglePause()" style="grid-column: span 2;">暂停模拟引擎</button>
        <button class="reset-btn" onclick="resetSim()">重置 80 星系相位</button>
    </div>
    <div class="info">
        当前流速: <b id="warpTxt">1.0x</b> | 
        状态: <b id="statTxt">正常运行</b><br>
        已知星系: <b>80 颗 (2026 数据库)</b><br>
        当前日期: <b>2026-01-17</b>
    </div>
    <div class="galaxy-list" id="galaxyCatalog"></div>
</div>

<canvas id="galaxyCanvas"></canvas>

<script>
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    let time = 0;
    let speed = 1.0;
    let isPaused = false;
    let stars = [];
    let asteroids = [];
    let galaxyNodes = [];

    // 核心大型星系
    const majorGalaxies = [
        { cn: "银河系", en: "Milky Way", d: 150, size: 12, v: 0.008, color: "#fff" },
        { cn: "仙女座星系", en: "Andromeda", d: 300, size: 15, v: 0.005, color: "#a0d8ff" },
        { cn: "三角座星系", en: "Triangulum", d: 450, size: 8, v: 0.012, color: "#ffcfdf" },
        { cn: "大麦哲伦云", en: "LMC", d: 180, size: 5, v: 0.015, color: "#d1ffcf" },
        { cn: "小麦哲伦云", en: "SMC", d: 210, size: 4, v: 0.014, color: "#fcf4dd" }
    ];

    function setupUniverse() {
        galaxyNodes = [];
        // 1. 加入主要星系
        majorGalaxies.forEach(g => galaxyNodes.push({ ...g, isMajor: true }));
        
        // 2. 补全至 80 个矮星系及节点
        for (let i = galaxyNodes.length + 1; i <= 80; i++) {
            const dist = 100 + Math.random() * 600;
            galaxyNodes.push({
                cn: `星系Node-${i}`,
                en: `Galaxy-N${i}`,
                d: dist,
                size: 2 + Math.random() * 3,
                v: (0.02 / (dist / 100)) * (Math.random() > 0.5 ? 1 : -1),
                color: `hsl(${Math.random() * 360}, 50%, 70%)`,
                isMajor: false
            });
        }

        // 填充列表
        const catalog = document.getElementById('galaxyCatalog');
        catalog.innerHTML = galaxyNodes.map(g => 
            `<div class="galaxy-item ${g.isMajor?'major':''}">• ${g.cn}</div>`
        ).join('');
    }

    function initEnvironment() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 背景恒星
        stars = Array.from({length: 500}, () => ({
            x: Math.random() * canvas.width, y: Math.random() * canvas.height, alpha: Math.random()
        }));

        // 陨石碎屑 (暗物质尘埃)
        asteroids = Array.from({length: 120}, () => ({
            angle: Math.random() * Math.PI * 2,
            dist: 50 + Math.random() * 600,
            v: 0.005 + Math.random() * 0.01,
            size: Math.random() * 2
        }));
    }

    function draw() {
        ctx.fillStyle = "#000308";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // 1. 背景星空
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
            ctx.fillRect(s.x, s.y, 1.2, 1.2);
        });

        // 2. 引力壁垒 (多层宏观轨道线)
        ctx.strokeStyle = "rgba(0, 229, 255, 0.08)";
        ctx.lineWidth = 1;
        for(let i=1; i<=8; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy, i * 100, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 3. 陨石/尘埃流
        asteroids.forEach(a => {
            const ax = cx + Math.cos(time * a.v + a.angle) * a.dist;
            const ay = cy + Math.sin(time * a.v + a.angle) * a.dist;
            ctx.fillStyle = "rgba(0, 229, 255, 0.4)";
            ctx.fillRect(ax, ay, a.size, a.size);
        });

        // 4. 80 星系运动渲染
        galaxyNodes.forEach(g => {
            const x = cx + Math.cos(time * g.v) * g.d;
            const y = cy + Math.sin(time * g.v) * g.d;

            // 星系核心辉光
            ctx.shadowBlur = g.isMajor ? 20 : 5;
            ctx.shadowColor = g.color;
            ctx.fillStyle = g.color;
            
            ctx.beginPath();
            // 2026版视觉：主星系显示为扁平椭圆盘
            if(g.isMajor) {
                ctx.ellipse(x, y, g.size * 2, g.size, time * 0.1, 0, Math.PI * 2);
            } else {
                ctx.arc(x, y, g.size, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.shadowBlur = 0;

            // 名字渲染 (主星系常驻，小星系减速后浮现)
            if (g.isMajor || speed < 0.4) {
                ctx.fillStyle = "rgba(255,255,255,0.8)";
                ctx.font = g.isMajor ? "bold 12px Segoe UI" : "9px Segoe UI";
                ctx.textAlign = "left";
                ctx.fillText(`${g.cn} ${g.en}`, x + g.size * 2 + 5, y + 4);
            }
        });

        if (!isPaused) time += 0.5 * speed;
        requestAnimationFrame(draw);
    }

    // --- 控制接口 ---
    function adjustSpeed(f) {
        speed *= f;
        speed = Math.min(Math.max(speed, 0.05), 20);
        document.getElementById('warpTxt').innerText = speed.toFixed(2) + "x";
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').innerText = isPaused ? "重启模拟引擎" : "暂停模拟引擎";
        document.getElementById('statTxt').innerText = isPaused ? "已停滞" : "正常运行";
        document.getElementById('statTxt').style.color = isPaused ? "#ff5252" : "#00e5ff";
    }

    function resetSim() {
        time = 0; speed = 1.0; isPaused = false;
        document.getElementById('warpTxt').innerText = "1.0x";
        document.getElementById('statTxt').innerText = "正常运行";
        document.getElementById('pauseBtn').innerText = "暂停模拟引擎";
        setupUniverse();
    }

    window.addEventListener('resize', initEnvironment);
    initEnvironment();
    setupUniverse();
    draw();
</script>

</body>
</html>
