<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>2026 太阳系全景模拟器 - 准卫星与卫星全增强版</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: "Segoe UI", sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(10, 15, 30, 0.9);
            padding: 18px; border-radius: 12px;
            border: 1px solid #00d4ff; backdrop-filter: blur(10px);
            z-index: 100;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #00d4ff; letter-spacing: 1px; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        button {
            background: #1a2639; border: 1px solid #34495e; color: #fff;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        button:hover { background: #00d4ff; color: #000; }
        .speed-info { font-family: monospace; color: #f4d03f; font-size: 14px; margin-bottom: 8px; }
        .status { font-size: 11px; color: #00d4ff; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="ui">
    <h1>太阳系全景模拟 (2026)</h1>
    <div class="status">🛡️ 日球层壁垒：激活 | 🛰️ 卫星：全员上线 | 💫 准卫星系统：就绪</div>
    <div class="speed-info" id="speedDisp">模拟倍速: 1.00x</div>
    <div class="controls">
        <button onclick="adjustSpeed(1.5)">🚀 加速</button>
        <button onclick="adjustSpeed(0.5)">🐌 减速</button>
        <button onclick="togglePause()" id="pauseBtn">⏸ 暂停</button>
        <button onclick="resetSim()">🔄 重置</button>
    </div>
</div>

<canvas id="solarCanvas"></canvas>

<script>
const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');

let time = 0;
let timeScale = 1.0;
let isPaused = false;
let width, height, centerX, centerY;

// 天体数据补全
const celestialBodies = [
    { name: "水星", dist: 65, size: 3.5, speed: 4.7, color: "#A5A5A5" },
    { 
        name: "金星", dist: 100, size: 7, speed: 3.5, color: "#E3BB76",
        moons: [{ name: "Zoozve (准)", d: 18, s: 0.08, sz: 1.2, c: "#adb5bd", isQuasi: true }]
    },
    { 
        name: "地球", dist: 145, size: 7.5, speed: 2.9, color: "#2271B3", 
        moons: [
            { name: "月球", d: 15, s: 0.1, sz: 2, c: "#ddd" },
            { name: "Kamo (准)", d: 22, s: 0.07, sz: 1, c: "#888", isQuasi: true }
        ] 
    },
    { 
        name: "火星", dist: 195, size: 5.5, speed: 2.4, color: "#E27B58",
        moons: [
            { name: "火卫一", d: 10, s: 0.4, sz: 1.2, c: "#aaa" },
            { name: "火卫二", d: 15, s: 0.15, sz: 1, c: "#bbb" }
        ]
    },
    { name: "谷神星", dist: 240, size: 2.5, speed: 1.8, color: "#95a5a6", isDwarf: true },
    { 
        name: "木星", dist: 320, size: 16, speed: 1.3, color: "#D39C7E",
        moons: [
            { name: "木卫一", d: 25, s: 0.2, sz: 2, c: "#ffcc00" },
            { name: "木卫二", d: 33, s: 0.15, sz: 1.8, c: "#fff" },
            { name: "木卫三", d: 42, s: 0.1, sz: 2.5, c: "#999" },
            { name: "木卫四", d: 52, s: 0.06, sz: 2.2, c: "#777" }
        ]
    },
    { 
        name: "土星", dist: 410, size: 14, speed: 0.9, color: "#C5AB6E", hasRing: true,
        moons: [
            { name: "土卫一", d: 22, s: 0.22, sz: 1.2, c: "#aaa" },
            { name: "土卫二", d: 28, s: 0.18, sz: 1.5, c: "#fff" },
            { name: "土卫三", d: 35, s: 0.12, sz: 1.8, c: "#ddd" },
            { name: "土卫六", d: 55, s: 0.05, sz: 3.5, c: "#ffa500" }
        ]
    },
    { 
        name: "天王星", dist: 500, size: 10, speed: 0.6, color: "#B5E3E3",
        moons: [
            { name: "米兰达", d: 18, s: 0.15, sz: 1.5, c: "#eee" },
            { name: "泰坦妮亚", d: 28, s: 0.1, sz: 2.2, c: "#ddd" }
        ]
    },
    { 
        name: "海王星", dist: 580, size: 10, speed: 0.5, color: "#4575D4",
        moons: [
            { name: "海卫一", d: 24, s: 0.08, sz: 2.8, c: "#cef" },
            { name: "海卫八", d: 32, s: 0.05, sz: 1.5, c: "#89a" }
        ]
    },
    { 
        name: "冥王星", dist: 650, size: 3.5, speed: 0.4, color: "#968B82", isDwarf: true,
        moons: [
            { name: "卡戎", d: 12, s: 0.2, sz: 2, c: "#888" },
            { name: "尼克斯", d: 18, s: 0.1, sz: 1, c: "#666" }
        ]
    },
    { name: "阋神星", dist: 730, size: 3.8, speed: 0.3, color: "#D1C4E9", isDwarf: true }
];

const asteroidBelts = [];
function createBelts() {
    asteroidBelts.length = 0;
    for(let i=0; i<400; i++) asteroidBelts.push({ dist: 255+Math.random()*40, angle: Math.random()*Math.PI*2, speed: 1.5+Math.random()*0.5, sz: Math.random()*1.5 });
    for(let i=0; i<600; i++) asteroidBelts.push({ dist: 680+Math.random()*100, angle: Math.random()*Math.PI*2, speed: 0.2+Math.random()*0.2, sz: Math.random()*2 });
}

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    centerX = width / 2; centerY = height / 2;
}

window.addEventListener('resize', resize);
resize(); createBelts();

const stars = Array.from({length: 600}, () => ({ x: Math.random()*4000-2000, y: Math.random()*4000-2000, sz: Math.random()*1.8 }));

function adjustSpeed(f) {
    timeScale = Math.max(0.01, timeScale * f);
    document.getElementById('speedDisp').innerText = `模拟倍速: ${timeScale.toFixed(2)}x`;
}

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pauseBtn').innerText = isPaused ? "▶ 继续" : "⏸ 暂停";
}

function resetSim() {
    time = 0; timeScale = 1; isPaused = false;
    document.getElementById('speedDisp').innerText = `模拟倍速: 1.00x`;
}

function draw() {
    ctx.fillStyle = "#010206"; ctx.fillRect(0, 0, width, height);
    ctx.save(); ctx.translate(centerX, centerY);

    // 星空
    ctx.fillStyle = "#fff"; stars.forEach(s => ctx.fillRect(s.x, s.y, s.sz, s.sz));

    // 日球层壁垒 (2026 增强动态)
    const barrierRadius = 880;
    const pulse = Math.sin(time * 0.01) * 15;
    const gradB = ctx.createRadialGradient(0, 0, barrierRadius - 60, 0, 0, barrierRadius + pulse);
    gradB.addColorStop(0, "rgba(0, 212, 255, 0)");
    gradB.addColorStop(0.5, "rgba(0, 212, 255, 0.08)");
    gradB.addColorStop(1, "rgba(0, 212, 255, 0)");
    ctx.fillStyle = gradB; ctx.beginPath(); ctx.arc(0, 0, barrierRadius + 30, 0, Math.PI * 2); ctx.fill();

    // 太阳
    const sunGlow = ctx.createRadialGradient(0, 0, 5, 0, 0, 60);
    sunGlow.addColorStop(0, "#fff700"); sunGlow.addColorStop(0.5, "rgba(255, 120, 0, 0.5)"); sunGlow.addColorStop(1, "transparent");
    ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(0, 0, 65, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();

    // 小天体带
    asteroidBelts.forEach(a => {
        const x = Math.cos(a.angle + time * a.speed * 0.001) * a.dist;
        const y = Math.sin(a.angle + time * a.speed * 0.001) * a.dist;
        ctx.fillStyle = "#444"; ctx.fillRect(x, y, a.sz, a.sz);
    });

    // 行星系统
    celestialBodies.forEach(p => {
        ctx.beginPath(); ctx.arc(0, 0, p.dist, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.stroke();

        const angle = time * p.speed * 0.005;
        const px = Math.cos(angle) * p.dist;
        const py = Math.sin(angle) * p.dist;

        // 卫星与准卫星
        if (p.moons) {
            p.moons.forEach(m => {
                const ma = time * m.s;
                const mx = px + Math.cos(ma) * m.d;
                const my = py + Math.sin(ma) * m.d;
                
                if (m.isQuasi) {
                    ctx.beginPath(); ctx.arc(px, py, m.d, 0, Math.PI * 2);
                    ctx.setLineDash([2, 4]); ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.stroke(); ctx.setLineDash([]);
                }
                
                ctx.fillStyle = m.c; ctx.beginPath(); ctx.arc(mx, my, m.sz, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = m.isQuasi ? "rgba(0, 212, 255, 0.6)" : "rgba(255,255,255,0.4)";
                ctx.font = "italic 9px Arial"; ctx.fillText(m.name, mx + 5, my + 3);
            });
        }

        if (p.hasRing) {
            ctx.beginPath(); ctx.ellipse(px, py, p.size * 2.2, p.size * 0.8, angle + 0.5, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(197, 171, 110, 0.3)"; ctx.lineWidth = 3; ctx.stroke();
        }

        ctx.shadowBlur = 15; ctx.shadowColor = p.color; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

        ctx.fillStyle = p.isDwarf ? "#aaa" : "#fff";
        ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
        ctx.fillText(p.name, px, py + p.size + 15);
    });

    ctx.restore();
    if (!isPaused) time += timeScale;
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
