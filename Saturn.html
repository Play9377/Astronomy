text = <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>2026 土星系统模拟器 - 壁垒加强版</title>
    <style>
        body {
            margin: 0;
            background-color: #050508;
            color: #e0e0e0;
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas { cursor: crosshair; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 30, 0.9);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #444;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #f4d03f; }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        button {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        button:hover { background: #5d6d7e; }
        .speed-display {
            grid-column: span 2;
            text-align: center;
            font-size: 14px;
            color: #f4d03f;
            margin: 5px 0;
            font-family: monospace;
        }
        .status { font-size: 12px; color: #00d4ff; margin-top: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <h1>土星系统模拟 (2026)</h1>
    <div class="legend">● <span style="color:#ffa500">土卫六 (Titan)</span> 运动模拟</div>
    <div class="status">🛡️ 土星电磁壁垒：已激活</div>
    
    <div class="controls">
        <div class="speed-display" id="speedDisp">倍速: 1.00x</div>
        <button onclick="changeSpeed(1.5)">🚀 加速</button>
        <button onclick="changeSpeed(0.5)">🐌 减速</button>
        <button onclick="togglePause()" id="pauseBtn">⏸ 暂停</button>
        <button onclick="resetSim()">🔄 重置</button>
    </div>
</div>

<canvas id="saturnCanvas"></canvas>

<script>
const canvas = document.getElementById('saturnCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let timeScale = 1.0;
let isPaused = false;
let barrierAnim = 0; // 用于壁垒动画的计数器

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const stars = Array.from({ length: 200 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    size: Math.random() * 1.5,
    opacity: Math.random()
}));

const initialMoons = [
    { name: "Mimas", label: "土卫一", distance: 85, radius: 2, speed: 0.04, color: "#aaa" },
    { name: "Enceladus", label: "土卫二", distance: 110, radius: 2.5, speed: 0.03, color: "#fff" },
    { name: "Tethys", label: "土卫三", distance: 140, radius: 3, speed: 0.025, color: "#ddd" },
    { name: "Dione", label: "土卫四", distance: 170, radius: 3, speed: 0.02, color: "#ccc" },
    { name: "Rhea", label: "土卫五", distance: 210, radius: 4, speed: 0.015, color: "#bbb" },
    { name: "Titan", label: "土卫六 (Titan)", distance: 300, radius: 8, speed: 0.008, color: "#ffa500", isTitan: true }
];

let moons = [];

function resetSim() {
    timeScale = 1.0;
    isPaused = false;
    document.getElementById('pauseBtn').innerText = "⏸ 暂停";
    updateSpeedDisp();
    moons = initialMoons.map(m => ({ ...m, angle: Math.random() * 6 }));
}

function changeSpeed(factor) {
    timeScale = Math.max(0.01, timeScale * factor);
    updateSpeedDisp();
}

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pauseBtn').innerText = isPaused ? "▶ 继续" : "⏸ 暂停";
}

function updateSpeedDisp() {
    document.getElementById('speedDisp').innerText = `倍速: ${timeScale.toFixed(2)}x`;
}

// 绘制“土星壁垒”（电磁屏蔽层）
function drawBarrier(centerX, centerY) {
    if (!isPaused) barrierAnim += 0.02 * timeScale;
    
    ctx.save();
    const pulse = Math.sin(barrierAnim) * 5; // 呼吸跳动效果
    const grad = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, 90 + pulse);
    
    grad.addColorStop(0, 'rgba(0, 212, 255, 0)');
    grad.addColorStop(0.5, 'rgba(0, 212, 255, 0.15)'); // 能量层边缘
    grad.addColorStop(1, 'rgba(0, 212, 255, 0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(centerX, centerY, 100 + pulse, (100 + pulse) * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawSaturnRings(x, y, isBack) {
    ctx.save();
    ctx.translate(x, y);
    const startAngle = isBack ? Math.PI : 0;
    const endAngle = isBack ? 0 : Math.PI;
    const ringColors = [
        { r: 60, lw: 4, c: "rgba(165, 140, 100, 0.3)" },
        { r: 70, lw: 8, c: "rgba(190, 170, 130, 0.5)" },
        { r: 80, lw: 2, c: "rgba(140, 120, 90, 0.4)" }
    ];
    ringColors.forEach(ring => {
        ctx.strokeStyle = ring.c;
        ctx.lineWidth = ring.lw;
        ctx.beginPath();
        ctx.ellipse(0, 0, ring.r, ring.r * 0.35, 0, startAngle, endAngle);
        ctx.stroke();
    });
    ctx.restore();
}

resetSim();

function draw() {
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, width, height);

    const centerX = width / 2;
    const centerY = height / 2;

    // 1. 星空
    ctx.fillStyle = "white";
    stars.forEach(s => {
        ctx.globalAlpha = s.opacity;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // 2. 轨道
    ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
    moons.forEach(moon => {
        ctx.beginPath();
        ctx.ellipse(centerX, centerY, moon.distance, moon.distance * 0.4, 0, 0, Math.PI * 2);
        ctx.stroke();
    });

    // 3. 土星后环与后置壁垒
    drawSaturnRings(centerX, centerY, true);
    
    // 4. 壁垒特效
    drawBarrier(centerX, centerY);

    // 5. 土星本体
    const grad = ctx.createRadialGradient(centerX - 10, centerY - 10, 5, centerX, centerY, 40);
    grad.addColorStop(0, '#f9e79f'); grad.addColorStop(1, '#997a3d');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(centerX, centerY, 40, 0, Math.PI * 2); ctx.fill();

    // 6. 土星前环
    drawSaturnRings(centerX, centerY, false);

    // 7. 卫星运动
    moons.forEach(moon => {
        const x = centerX + Math.cos(moon.angle) * moon.distance;
        const y = centerY + Math.sin(moon.angle) * moon.distance * 0.4;

        ctx.fillStyle = moon.color;
        if(moon.isTitan) { ctx.shadowBlur = 15; ctx.shadowColor = moon.color; }
        ctx.beginPath(); ctx.arc(x, y, moon.radius, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = moon.isTitan ? "#ffa500" : "rgba(200, 200, 200, 0.8)";
        ctx.font = moon.isTitan ? "bold 13px Arial" : "11px Arial";
        ctx.fillText(moon.label, x + moon.radius + 5, y + 4);

        if (!isPaused) moon.angle += moon.speed * timeScale;
    });

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
